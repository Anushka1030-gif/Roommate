services:
  mysql:
    image: mysql:8.0
    container_name: roomiematch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: roomiematch
      MYSQL_USER: roomie_user
      MYSQL_PASSWORD: roomie_secret
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    driver: local
